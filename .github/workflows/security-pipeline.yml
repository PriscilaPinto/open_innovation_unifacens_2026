name: security-scan

on:
  push:
    branches:
      - develop

  pull_request:

  workflow_dispatch:

  # Executa automaticamente 1 vez por dia
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout do código
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: develop

      # 2. Setup PHP
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.1

      # 3. Instalar dependências
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      # 4. Criar pasta de relatórios
      - name: Prepare reports folder
        run: mkdir -p reports

      # 5. Instalar Trivy
      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" \
          | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      # 6. Rodar scan
      - name: Run Trivy scan
        run: |
          trivy fs . \
            --format json \
            --output reports/report.json

      # 7. Upload artifact
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report-json
          path: reports/report.json

      # 8. Commitar relatório automaticamente na develop (sem rebase)
      - name: Commit and push report
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add reports/report.json
          git commit -m "Atualiza relatório Trivy" || echo "Sem alterações"

          # push direto sem rebase (evita conflitos)
          git push origin develop



          
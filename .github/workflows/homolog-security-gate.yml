name: DevSecOps - Security Gate (Homolog)

# Dispara SOMENTE quando um PR com destino homolog for mergeado
# A pipeline 1 (ai-agent-security-pipeline) NÃO é re-executada
on:
  pull_request:
    branches: [homolog]
    types: [closed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ============================================================
  # Executa apenas quando o PR foi MERGEADO em homolog
  # Valida que as correções eliminaram as vulnerabilidades
  # e que a aplicação não quebrou
  # ============================================================
  security-gate:
    name: 🧪 Re-scan e Validação em Homolog
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: homolog

      # ----------------------------------------------------------
      # Re-scan com o código já corrigido em homolog
      # Se ainda houver CVE CRITICAL/HIGH → exit-code 1 → falha
      # ----------------------------------------------------------
      - name: Re-scan Trivy em homolog
        id: trivy-scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'

      # ----------------------------------------------------------
      # Validação básica da aplicação PHP (se existir)
      # Garante que a atualização de dependências não quebrou nada
      # ----------------------------------------------------------
      - name: Instalar dependências PHP (se composer.json existir)
        if: hashFiles('composer.json') != ''
        run: |
          sudo apt-get install -y php-cli --quiet
          curl -sS https://getcomposer.org/installer | php
          php composer.phar install --no-interaction --no-progress 2>&1 | tail -5

      - name: Validar aplicação PHP (smoke test)
        if: hashFiles('composer.json') != '' && hashFiles('index.php') != ''
        run: |
          php -l index.php && echo "✅ Syntax OK" || echo "⚠️ Syntax error detectado"

      # ----------------------------------------------------------
      # Sucesso: atualiza status no Supabase
      # ----------------------------------------------------------
      - name: Registrar sucesso no Supabase
        if: success()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_SSLMODE: require
        run: |
          pip install psycopg2-binary python-dotenv --quiet
          python - <<'EOF'
          import sys
          sys.path.insert(0, "scripts")
          from db import connect_db

          conn = connect_db()
          cur = conn.cursor()
          cur.execute("""
              UPDATE pipeline_executions
              SET status = 'SUCCESS', finished_at = NOW()
              WHERE status = 'RUNNING'
              ORDER BY started_at DESC
              LIMIT 1
          """)
          rows = cur.rowcount
          conn.commit()
          conn.close()
          print(f"✅ Execução marcada como SUCCESS ({rows} registro(s) atualizado(s))")
          EOF

      # ----------------------------------------------------------
      # Falha: registra ROLLED_BACK no banco para auditoria
      # develop continua inalterado — equipe revisa manualmente
      # ----------------------------------------------------------
      - name: Registrar falha e rollback no Supabase
        if: failure()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_SSLMODE: require
        run: |
          pip install psycopg2-binary python-dotenv --quiet
          python - <<'EOF'
          import sys
          sys.path.insert(0, "scripts")
          from db import connect_db

          conn = connect_db()
          cur = conn.cursor()

          # Log das versões anteriores para auditoria
          cur.execute("""
              SELECT package_name, installed_version, previous_version
              FROM vulnerability_records
              WHERE remediation_status = 'REMEDIATED'
                AND previous_version IS NOT NULL
              ORDER BY updated_at DESC
          """)
          for pkg, installed, prev in cur.fetchall():
              print(f"⏪ {pkg}: {installed} ← rollback para {prev}")

          # Marca execução como FAILED
          cur.execute("""
              UPDATE pipeline_executions
              SET status = 'FAILED', finished_at = NOW()
              WHERE status = 'RUNNING'
              ORDER BY started_at DESC
              LIMIT 1
          """)

          # Marca vulnerabilidades como ROLLED_BACK
          cur.execute("""
              UPDATE vulnerability_records
              SET remediation_status = 'ROLLED_BACK', updated_at = NOW()
              WHERE remediation_status = 'REMEDIATED'
          """)

          conn.commit()
          conn.close()
          print("❌ Rollback registrado. Revise os arquivos em homolog manualmente.")
          EOF
          exit 1

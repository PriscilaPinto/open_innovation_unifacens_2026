name: DevSecOps - Security Gate (Homolog)

# Dispara quando:
#   1. Push em fix/remediation (após aprovação do PR develop → fix/remediation)
#   2. workflow_dispatch
on:
  push:
    branches: [fix/remediation]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  security-gate:
    name: 🧪 Re-scan e Validação da Remediação
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remediation

      # ============================================================
      # FASE 1: Re-scan Trivy — garante que NENHUMA vulnerabilidade
      #         CRITICAL ou HIGH persiste após o merge
      # exit-code 1 → bloqueia o pipeline se encontrar vulns
      # ============================================================
      - name: Instalar Trivy
        run: |
          sudo apt-get install -y wget gnupg lsb-release --quiet
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq && sudo apt-get install -y trivy

      - name: Re-scan Trivy (exit-code 1 bloqueia se vulnerável)
        id: trivy
        continue-on-error: true
        run: |
          trivy fs . --format table --severity CRITICAL,HIGH --exit-code 1
          echo "✅ Nenhuma vulnerabilidade CRITICAL/HIGH encontrada em homolog"
        shell: bash

      - name: Capturar resultado do Trivy
        if: always()
        run: |
          echo "TRIVY_EXIT_CODE=${{ steps.trivy.outcome == 'success' && '0' || '1' }}" >> $GITHUB_ENV

      # ============================================================
      # FASE 2: Smoke test — valida estabilidade básica
      # Só instala o necessário com base no que existe no repositório
      # ============================================================
      - name: Smoke test PHP (se existir)
        if: hashFiles('composer.json') != '' || hashFiles('index.php') != ''
        run: |
          # Só instala PHP se houver arquivos PHP
          if [ -f "index.php" ] || [ -f "composer.json" ]; then
            sudo apt-get install -y php-cli --quiet
            curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
            composer install --no-interaction --no-progress --prefer-dist 2>&1 | tail -5
          fi
          # Valida sintaxe dos arquivos PHP
          for f in *.php; do
            [ -f "$f" ] && php -l "$f" && echo "✅ $f: sintaxe OK"
          done

      - name: Smoke test básico (validação de arquivos)
        run: |
          echo "✅ Estrutura do projeto íntegra"
          echo "   Total de arquivos: $(find . -type f -not -path './.git/*' -not -path './vendor/*' -not -path './__pycache__/*' | wc -l)"

      # ============================================================
      # FASE 3: Atualização do Supabase
      # ============================================================
      - name: Registrar no Supabase
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_SSLMODE: require
        run: |
          pip install psycopg2-binary python-dotenv --quiet
          python - <<'EOF'
          import sys, os
          sys.path.insert(0, "scripts")
          from db import connect_db

          conn = connect_db()
          cur = conn.cursor()

          trivy_exit = os.environ.get('TRIVY_EXIT_CODE', '1')

          if trivy_exit == '0':
              # Sucesso: homolog validado
              cur.execute("""
                  UPDATE pipeline_executions
                  SET homolog_status = 'VALIDATED', finished_at = NOW()
                  WHERE status IN ('SUCCESS', 'PARTIAL')
                  ORDER BY started_at DESC
                  LIMIT 1
              """)
              conn.commit()
              print("✅ Homolog VALIDADO — nenhuma vulnerabilidade restante")
          else:
              # Falha: homolog rejeitado
              cur.execute("""
                  SELECT package_name, installed_version, previous_version
                  FROM vulnerability_records
                  WHERE remediation_status = 'REMEDIATED'
                    AND previous_version IS NOT NULL
                  ORDER BY updated_at DESC
              """)
              rows = cur.fetchall()
              if rows:
                  print("⚠️  Rollback disponível para:")
                  for pkg, installed, prev in rows:
                      print(f"    {pkg}: {installed} ← {prev}")

              cur.execute("""
                  UPDATE pipeline_executions
                  SET homolog_status = 'REJECTED', finished_at = NOW()
                  WHERE status IN ('SUCCESS', 'PARTIAL')
                  ORDER BY started_at DESC
                  LIMIT 1
              """)
              cur.execute("""
                  UPDATE vulnerability_records
                  SET remediation_status = 'ROLLED_BACK', updated_at = NOW()
                  WHERE remediation_status = 'REMEDIATED'
              """)
              conn.commit()
              print("❌ Homolog REJEITADO — vulnerabilidades persistem (rollback registrado)")

          conn.close()
          EOF
              # ============================================================
      - name: Instalar GitHub CLI
        run: |
          type -p curl >/dev/null || sudo apt install curl -y
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
            | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg

          sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg

          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
            | sudo tee /etc/apt/sources.list.d/github-cli.list >/dev/null

          sudo apt update
          sudo apt install gh -y
      # ============================================================
      # FASE 4: Criação automática do PR para homolog
      # Executa somente se toda a validação foi concluída.
      # ============================================================
      - name: Criar Pull Request para homolog
        if: env.TRIVY_EXIT_CODE == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base homolog \
            --head fix/remediation \
            --title "chore: Remediação validada - Promote para homolog" \
            --body "
            ## Remediação validada automaticamente

            - ✅ Re-scan Trivy executado
            - ✅ Smoke Tests aprovados
            - ✅ Atualização do Supabase concluída

            A remediação foi validada automaticamente e está pronta para homologação.
            " || echo "PR já existe."

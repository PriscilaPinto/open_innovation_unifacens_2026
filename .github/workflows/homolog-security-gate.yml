name: DevSecOps - Security Gate (Homolog)

# Dispara quando homolog recebe push (merge automático da pipeline 1)
# A pipeline 1 NÃO é re-executada — este workflow é independente
on:
  push:
    branches: [homolog]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-gate:
    name: 🧪 Re-scan e Validação em Homolog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: homolog

      # Re-scan com o código já corrigido em homolog
      # exit-code 1 garante que o job falha se vuln persistir
      - name: Re-scan Trivy
        id: trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'

      # Smoke test: valida sintaxe PHP após atualização das dependências
      - name: Instalar dependências PHP
        if: hashFiles('composer.json') != ''
        run: |
          sudo apt-get install -y php-cli --quiet
          curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
          composer install --no-interaction --no-progress --prefer-dist 2>&1 | tail -10

      - name: Smoke test PHP
        if: hashFiles('index.php') != ''
        run: |
          php -l index.php
          echo "✅ Sintaxe PHP OK"

      # Sucesso: atualiza status no Supabase
      - name: Registrar sucesso no Supabase
        if: success()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_SSLMODE: require
        run: |
          pip install psycopg2-binary python-dotenv --quiet
          python - <<'EOF'
          import sys
          sys.path.insert(0, "scripts")
          from db import connect_db

          conn = connect_db()
          cur = conn.cursor()
          cur.execute("""
              UPDATE pipeline_executions
              SET status = 'SUCCESS', finished_at = NOW()
              WHERE status = 'RUNNING'
              ORDER BY started_at DESC
              LIMIT 1
          """)
          conn.commit()
          conn.close()
          print("✅ Status atualizado para SUCCESS no Supabase")
          EOF

      # Falha: registra no banco — develop continua seguro e inalterado
      - name: Registrar falha no Supabase
        if: failure()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_SSLMODE: require
        run: |
          pip install psycopg2-binary python-dotenv --quiet
          python - <<'EOF'
          import sys
          sys.path.insert(0, "scripts")
          from db import connect_db

          conn = connect_db()
          cur = conn.cursor()

          # Loga versões anteriores disponíveis para rollback manual
          cur.execute("""
              SELECT package_name, installed_version, previous_version
              FROM vulnerability_records
              WHERE remediation_status = 'REMEDIATED'
                AND previous_version IS NOT NULL
              ORDER BY updated_at DESC
          """)
          rows = cur.fetchall()
          if rows:
              print("Versões anteriores disponíveis para rollback:")
              for pkg, installed, prev in rows:
                  print(f"  {pkg}: {installed} ← {prev}")
          else:
              print("Nenhuma versão anterior registrada.")

          cur.execute("""
              UPDATE pipeline_executions
              SET status = 'FAILED', finished_at = NOW()
              WHERE status = 'RUNNING'
              ORDER BY started_at DESC
              LIMIT 1
          """)
          cur.execute("""
              UPDATE vulnerability_records
              SET remediation_status = 'ROLLED_BACK', updated_at = NOW()
              WHERE remediation_status = 'REMEDIATED'
          """)
          conn.commit()
          conn.close()
          print("❌ Falha registrada no Supabase. Revise homolog manualmente.")
          EOF
          exit 1

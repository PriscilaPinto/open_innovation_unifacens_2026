name: DevSecOps Automated Remediation Pipeline

on:
  push:
    branches:
      - develop
  pull_request:
  workflow_dispatch: # 🚀 Permite rodar manualmente clicando no botão para testar agora
  schedule:
    - cron: "0 3 * * *" # ⏰ Cron mantido para as 03:00 UTC

permissions:
  contents: write       # Necessário para criar a branch temporária de correção e commitar
  pull-requests: write  # Necessário para abrir o Pull Request automaticamente contra a homolog

jobs:
  # ==========================================
  # JOB 1: SCAN DE VULNERABILIDADES
  # ==========================================
  security-scan:
    name: 🔍 Scan de Vulnerabilidades (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.1

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare reports folder
        run: mkdir -p reports

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" \
          | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Run Trivy scan
        run: |
          trivy fs . \
            --format json \
            --output reports/report.json

      - name: Upload Trivy Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report-json
          path: reports/report.json

  # ==========================================
  # JOB 2: AGENTE DE IA (REMEDIAÇÃO SCA)
  # ==========================================
  ai-remediation:
    name: 🤖 Executar Agente de IA (Remediação)
    needs: security-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Download Trivy Report
        uses: actions/download-artifact@v4
        with:
          name: trivy-report-json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          pip install langchain-core langchain-google-genai

      - name: Run AI Remediation Framework
        env:
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python framework.py

      # 🔄 CORREÇÃO: Sobe os arquivos reais do Composer modificados pelo script Python
      - name: Upload Remediated Composer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: remediated-composer-files
          path: |
            composer.json
            composer.lock

  # ==========================================
  # JOB 3: VALIDAÇÃO E ABERTURA AUTOMÁTICA DE PR
  # ==========================================
  security-validation:
    name: 🧪 Validação e Abertura de PR
    needs: ai-remediation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: homolog # Faz o checkout mirando na homolog para aplicar as correções em cima dela

      - name: Download Remediated Composer Files
        uses: actions/download-artifact@v4
        with:
          name: remediated-composer-files

      - name: Setup PHP Environment for Sandbox
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      # Valida no Sandbox se as atualizações da IA instalam perfeitamente sem quebrar o ambiente
      - name: 🧪 Sandbox - Teste de Instalação Pós-Patch
        run: composer install --no-interaction --dry-run

      - name: 🔍 Re-scan de Segurança no Composer da IA
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1' # Se o patch da IA falhar e as CVEs continuarem lá, a esteira quebra aqui!

      - name: Clean Cache
        run: rm -rf .cache/

      - name: 🚀 Create Pull Request to Homolog
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: fix/ai-autonomous-patch
          base: homolog
          title: "🤖 [AI SCA Remediation] Atualização autônoma de dependências vulneráveis"
          body: |
            ## 🛡️ Remediação Autônoma Baseada em IA (SCA)
            Este Pull Request foi gerado automaticamente pelo **Framework de Correção Baseado em Generative AI**.

            ### 📊 Evidências e Validações:
            - **Sandbox Integration Test (`composer install --dry-run`):** Executado com sucesso no runner da esteira.
            - **Re-scan de Segurança (Trivy):** Executado após a correção e acusou **ZERO** vulnerabilidades Críticas ou Altas.
          commit-message: "fix: atualiza pacotes vulneráveis via IA (SCA)"
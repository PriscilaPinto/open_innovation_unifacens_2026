name: DevSecOps - Remediação Automática

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  # ============================================================
  # JOB 1: Scan de vulnerabilidades (develop — somente leitura)
  # ============================================================
  security-scan:
    name: 🔍 Trivy SCA Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop

      - name: Instalar Trivy
        run: |
          sudo apt-get install -y wget gnupg lsb-release --quiet
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq && sudo apt-get install -y trivy

      - name: Scan JSON (para processamento pelo agente)
        run: |
          mkdir -p reports
          trivy fs . --format json --output reports/report.json --skip-version-check

      - name: Scan tabela (visualização no log)
        run: |
          trivy fs . --format table --severity CRITICAL,HIGH,MEDIUM --skip-version-check || true

      - uses: actions/upload-artifact@v4
        with:
          name: trivy-report-${{ github.run_id }}
          path: reports/report.json

  # ============================================================
  # JOB 2: Agente de IA processa vulnerabilidades, aplica
  #         correções e mergeia em fix-remediation → homolog
  #
  # develop NÃO é alterado.
  # Branch intermediária: fix-remediation (nome fixo, sobrescrita a cada run)
  # ============================================================
  remediation:
    name: 🤖 Agente IA - Remediação e Merge em Homolog
    needs: security-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          name: trivy-report-${{ github.run_id }}
          path: reports/

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar PHP e Composer
        run: |
          sudo apt-get install -y php-cli php-curl php-mbstring php-xml --quiet
          curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
          composer --version

      - name: Instalar dependências Python
        run: pip install -r requirements.txt --quiet

      - name: Aplicar schema e migrations no Supabase
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_SSLMODE: require
        run: |
          python - <<'EOF'
          import sys
          sys.path.insert(0, "scripts")
          from db import connect_db

          conn = connect_db()
          cur = conn.cursor()

          with open("database/schema.sql") as f:
              cur.execute(f.read())
          conn.commit()

          with open("database/migrate_add_previous_version.sql") as f:
              cur.execute(f.read())
          conn.commit()

          try:
              with open("database/seed_homologated_versions.sql") as f:
                  cur.execute(f.read())
              conn.commit()
              print("Seed aplicado")
          except Exception as e:
              conn.rollback()
              print(f"Seed ja populado: {e}")

          conn.close()
          print("Schema + migrations aplicados")
          EOF

      # Agente de IA orquestra todo o pipeline:
      # Stage 1: lê Trivy report + persiste no Supabase + consulta OSV
      # Stage 2: IA analisa CVEs e decide estratégia (APPROVED/MANUAL_REVIEW)
      # Stage 3: aplica patches via composer/npm/pip
      # Stage 4: re-scan Trivy + smoke test PHP para validar correções
      - name: Executar Agente de IA (framework completo)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_SSLMODE: require
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          OPEN_ROUTER_API: ${{ secrets.OPEN_ROUTER_API }}
          MIN_SEVERITY: HIGH
          AI_MODEL: google/gemini-2.5-flash
          AI_TEMPERATURE: "0.1"
          AI_MAX_TOKENS: "600"
        run: python framework.py

      # Branch intermediária com nome FIXO: fix-remediation
      # Força push (sobrescreve execuções anteriores)
      # develop permanece intacto
      - name: Publicar correções na branch fix-remediation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Cria ou reseta fix-remediation a partir do HEAD atual de develop
          git checkout -B fix-remediation

          git add composer.json composer.lock package.json package-lock.json requirements.txt 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "HAS_CHANGES=false" >> $GITHUB_ENV
            echo "Nenhuma alteração detectada — sem vulnerabilidades para corrigir."
          else
            git commit -m "fix: remediação automática via agente de IA (run #${{ github.run_id }})"
            git push origin fix-remediation --force
            echo "HAS_CHANGES=true" >> $GITHUB_ENV
            echo "Branch fix-remediation atualizada com as correções"
          fi

      # Garante que homolog existe
      - name: Garantir branch homolog
        if: env.HAS_CHANGES == 'true'
        run: |
          git fetch origin
          if ! git ls-remote --heads origin homolog | grep -q homolog; then
            git checkout -b homolog
            git push origin homolog
            echo "Branch homolog criada"
          fi

      # Merge automático de fix-remediation em homolog
      - name: Merge automático em homolog
        if: env.HAS_CHANGES == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git checkout homolog
          git pull origin homolog

          git merge --no-ff origin/fix-remediation \
            -m "chore: merge automatico da remediacao (run #${{ github.run_id }})" \
            --allow-unrelated-histories

          git push origin homolog
          echo "Correcoes mergeadas em homolog automaticamente"

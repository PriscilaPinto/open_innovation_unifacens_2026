name: DevSecOps Automated SCA Remediation (Unificado)

on:
  push:
    branches:
      - develop

permissions:
  contents: write
  pull-requests: write

jobs:
  framework-remidiation:
    name: 🤖 Executar Framework de IA e Automação SCA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Install Dependencies (Vendor Legacy)
        run: composer install --no-interaction --prefer-dist

      - name: Prepare reports folder
        run: mkdir -p reports

      # Passo 1: Executa o Scan Oficial focado no diretório
      - name: 🔍 Run Trivy Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'json'
          output: 'reports/report.json'

      # Configura o Python para a IA rodar
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          pip install langchain-core langchain-google-genai

      # Passo 2: O seu framework.py entra em ação, lê o JSON e roda o update do Composer
      - name: 🧠 Run AI Remediation Framework
        env:
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python framework.py

      # Passo 3: Sandbox Anti-Crash - Testa se o novo lock não quebrou a instalação do PHP
      - name: 🧪 Sandbox - Teste de Instalação Pós-Patch
        run: composer install --no-interaction --dry-run

      - name: Clean Cache
        run: rm -rf .cache/

      # Passo 4: Abre o Pull Request para a Homolog contendo APENAS o composer alterado pela IA
      - name: 🚀 Create Pull Request to Homolog
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: fix/ai-autonomous-patch
          base: homolog
          title: "🤖 [AI SCA Remediation] Atualização autônoma de dependências vulneráveis"
          body: |
            ## 🛡️ Remediação Autônoma Baseada em IA (SCA)
            Este Pull Request foi gerado automaticamente pelo **Framework de Correção Baseado em Generative AI**.

            ### 📊 Evidências e Validações:
            - **Análise de Dependências:** `composer.json` e `composer.lock` atualizados estrategicamente pela IA.
            - **Sandbox Integration Test:** Executado com sucesso no runner da esteira.
          commit-message: "fix: atualiza pacotes vulneráveis via IA (SCA)"
name: DevSecOps - Remediação Automática

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  # ============================================================
  # JOB 1: Scan de vulnerabilidades (develop — somente leitura)
  # ============================================================
  security-scan:
    name: 🔍 Trivy SCA Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop

      - name: Instalar Trivy
        run: |
          sudo apt-get install -y wget gnupg lsb-release --quiet
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq && sudo apt-get install -y trivy

      - name: Scan JSON (para processamento pelo agente)
        run: |
          mkdir -p reports
          trivy fs . --format json --output reports/report.json --skip-version-check

      - name: Scan tabela (visualização no log)
        run: |
          trivy fs . --format table --severity CRITICAL,HIGH,MEDIUM --skip-version-check || true

      - uses: actions/upload-artifact@v4
        with:
          name: trivy-report-${{ github.run_id }}
          path: reports/report.json

  # ============================================================
  # JOB 2: Agente de IA processa vulnerabilidades, aplica
  #         correções e mergeia em fix-remediation → homolog
  #
  # develop NÃO é alterado.
  # Branch intermediária: fix-remediation (nome fixo, sobrescrita a cada run)
  # ============================================================
  remediation:
    name: 🤖 Agente IA - Remediação (develop → fix/remediation)
    needs: security-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          name: trivy-report-${{ github.run_id }}
          path: reports/

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar PHP, Node.js e dependências
        run: |
          # PHP + Composer
          sudo apt-get install -y php-cli php-curl php-mbstring php-xml --quiet
          curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
          composer --version
          
          # Node.js + npm
          sudo apt-get install -y nodejs npm --quiet
          node --version
          npm --version

      - name: Instalar dependências Python
        run: pip install -r requirements.txt --quiet

      - name: Aplicar schema e migrations no Supabase
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_SSLMODE: require
        run: |
          python - <<'EOF'
          import sys
          sys.path.insert(0, "scripts")
          from db import connect_db

          conn = connect_db()
          cur = conn.cursor()

          # Schema principal
          with open("database/schema.sql") as f:
              cur.execute(f.read())
          conn.commit()
          print("✅ Schema principal aplicado")

          # Todas as migrations em um arquivo
          with open("database/migrate_add_previous_version.sql") as f:
              cur.execute(f.read())
          conn.commit()
          print("✅ Migrations aplicadas (previous_version + source_db)")

          # Remove entradas erradas do psr7 e força re-seed
          cur.execute("""
              DELETE FROM homologated_versions
              WHERE package_name = 'guzzlehttp/psr7'
                AND safe_version = '1.9.1'
          """)
          conn.commit()
          print("✅ Cleanup: versão psr7 1.9.1 removida")

          try:
              with open("database/seed_homologated_versions.sql") as f:
                  cur.execute(f.read())
              conn.commit()
              print("✅ Seed aplicado")
          except Exception as e:
              conn.rollback()
              print(f"⚠️  Seed já populado: {e}")

          conn.close()
          print("✅ BD pronto: schema + migrations + seed!")
          EOF

      # Agente de IA orquestra todo o pipeline:
      # Stage 1: lê Trivy report + persiste no Supabase + consulta OSV
      # Stage 2: IA analisa CVEs e decide estratégia (APPROVED/MANUAL_REVIEW)
      # Stage 3: aplica patches via composer/npm/pip (multi-linguagem)
      - name: Executar Agente de IA (Stages 1-3)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_SSLMODE: require
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          OPEN_ROUTER_API: ${{ secrets.OPEN_ROUTER_API }}
          MIN_SEVERITY: HIGH
          AI_MODEL: google/gemini-2.5-flash
          AI_TEMPERATURE: "0.1"
          AI_MAX_TOKENS: "600"
        run: python framework.py

      # Stage 4: Re-scan Trivy é feito na security-gate em homolog
      # (não repetir aqui — trivy não está instalado neste job)
      # Responsabilidade: job security-scan instala trivy, não este job

      # Smoke test multilinguagem (Req 8)
      - name: Smoke test (validação de estabilidade)
        run: |
          # PHP
          if [ -f "composer.json" ] && command -v php &> /dev/null; then
            echo "--- PHP smoke test ---"
            for f in index.php; do
              [ -f "$f" ] && php -l "$f" && echo "✅ $f: OK"
            done
            composer install --no-interaction --no-progress --prefer-dist 2>&1 | tail -3
          fi
          # Node.js
          if [ -f "package.json" ] && command -v node &> /dev/null; then
            echo "--- Node.js smoke test ---"
            node --version && npm install --dry-run 2>&1 | tail -3
          fi
          # Python
          if [ -f "requirements.txt" ] && command -v python &> /dev/null; then
            echo "--- Python smoke test ---"
            python -c "import pkg_resources; pkg_resources.require(open('requirements.txt').readlines())" 2>&1 | tail -3
          fi
          echo "✅ Smoke tests concluídos"

      # ============================================================
      # CRÍTICO: Preservar alterações dos patches ANTES de resetar develop
      # 
      # FLUXO CORRETO:
      #   1. Stash: salva as alterações feitas por composer/npm/pip
      #   2. Reset develop: garante que develop permanece imutável
      #   3. Criar fix/remediation: a partir de develop limpa
      #   4. Pop stash: aplica as correções na branch fix/remediation
      #   5. Commit + push: envia as correções para o branch
      # ============================================================
      - name: Salvar alterações dos patches (stash)
        run: |
          if git diff --quiet; then
            echo "HAS_STASH=false" >> $GITHUB_ENV
            echo "📭 Nenhuma alteração detectada para stash"
          else
            git stash save --include-untracked "patches-$(date +%s)"
            echo "HAS_STASH=true" >> $GITHUB_ENV
            echo "📦 Alterações dos patches salvas em stash"
          fi

      - name: Garantir develop imutável
        run: |
          git checkout develop
          git reset --hard origin/develop
          echo "✅ develop resetada para origin/develop (imutável)"

      - name: Aplicar correções na branch fix/remediation
        if: env.HAS_STASH == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Cria ou reseta fix/remediation a partir de develop limpa
          git checkout -B fix/remediation origin/develop

          # Aplica as alterações salvas (composer.json, composer.lock, etc.)
          git stash pop

          # Força git a ver as mudanças do sistema de arquivos
          git update-index --refresh 2>/dev/null || true

          # Adiciona todos os arquivos de dependências modificados
          for f in composer.json composer.lock package.json package-lock.json requirements.txt; do
            if [ -f "$f" ]; then
              git add -f "$f"
              echo "Adicionado: $f"
            fi
          done

          # Verifica se há mudanças staged
          if git diff --cached --quiet; then
            echo "HAS_CHANGES=false" >> $GITHUB_ENV
            echo "Nenhuma alteração detectada — sem vulnerabilidades para corrigir."
          else
            git status --short
            git commit -m "fix: remediação automática via agente de IA (run #${{ github.run_id }})"
            git push origin fix/remediation --force
            echo "HAS_CHANGES=true" >> $GITHUB_ENV
            echo "✅ Branch fix/remediation atualizada automaticamente com as correções"
          fi

      # Garante que homolog existe
      - name: Garantir branch homolog
        if: env.HAS_CHANGES == 'true'
        run: |
          git fetch origin
          if ! git ls-remote --heads origin homolog | grep -q homolog; then
            git checkout -b homolog origin/develop
            git push origin homolog
            echo "Branch homolog criada"
          fi

      # PR aguardando aprovação: fix/remediation → homolog
      - name: Criar PR para aprovação (fix/remediation → homolog)
        if: env.HAS_CHANGES == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Verifica se já existe PR aberta
          EXISTING_PR=$(gh pr list \
            --head fix/remediation \
            --base homolog \
            --state open \
            --json number \
            --jq '.[0].number' 2>/dev/null || echo "")
          
          if [ -n "$EXISTING_PR" ]; then
            echo "✅ PR já existe: #$EXISTING_PR"
            exit 0
          fi
          
          # Cria nova PR aguardando aprovação
          gh pr create \
            --base homolog \
            --head fix/remediation \
            --title "🧪 Deploy em Homolog: remediação automática" \
            --body "Remediação automática de vulnerabilidades via agente de IA

          **Fluxo:** develop (automático) → fix/remediation (automático) → **homolog** ⏳ (aguarda aprovação)
          
          Esta PR contém as correções aplicadas automaticamente pela pipeline.
          
          **Próximos passos:**
          1. Revisar mudanças (dependências atualizadas)
          2. Testar em homolog
          3. Aprovar para merge
          4. Security-gate valida antes de merge
          
          Run: #${{ github.run_id }}
          
          ---
          
          **Estratégia de Versioning:** same-major (compatibilidade legado)
          **Rollback:** versões anteriores armazenadas em Supabase" \
            --draft
          
          echo "✅ PR criada: fix/remediation → homolog (aguardando aprovação)"

      - name: Info - Pipeline Completa
        if: env.HAS_CHANGES == 'true'
        run: |
          echo "✅ Correções aplicadas automaticamente em fix/remediation"
          echo "📋 PR criada para homolog (aguardando aprovação manual)"
          echo "🔒 develop permanece imutável"

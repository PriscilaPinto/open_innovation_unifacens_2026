name: DevSecOps - Remediação Automática

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  # ============================================================
  # JOB 1: Scan de vulnerabilidades com Trivy
  # ============================================================
  security-scan:
    name: 🔍 Trivy SCA Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop

      - name: Instalar Trivy
        run: |
          sudo apt-get install -y wget gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update && sudo apt-get install -y trivy

      - name: Executar scan
        run: |
          mkdir -p reports
          trivy fs . --format json --output reports/report.json

      - uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: reports/report.json

  # ============================================================
  # JOB 2: Processar vulnerabilidades e aplicar remediações
  # Conecta no Supabase — histórico permanente entre execuções
  # ============================================================
  remediation:
    name: 🤖 Remediação Automática
    needs: security-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop

      - uses: actions/download-artifact@v4
        with:
          name: trivy-report
          path: reports/

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências Python
        run: pip install -r requirements.txt

      - name: Criar tabelas se não existirem (idempotente)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_SSLMODE: require
        run: |
          python - <<'EOF'
          import sys, os
          sys.path.insert(0, "scripts")
          from db import connect_db
          conn = connect_db()
          cur = conn.cursor()
          with open("database/schema.sql") as f:
              cur.execute(f.read())
          conn.commit()
          conn.close()
          print("Schema aplicado")
          EOF

      - name: Popular banco curado (INSERT OR IGNORE)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_SSLMODE: require
        run: |
          python - <<'EOF'
          import sys
          sys.path.insert(0, "scripts")
          from db import connect_db
          conn = connect_db()
          cur = conn.cursor()
          try:
              with open("database/seed_homologated_versions.sql") as f:
                  cur.execute(f.read())
              conn.commit()
              print("Seed aplicado")
          except Exception as e:
              conn.rollback()
              print(f"Seed: {e}")
          conn.close()
          EOF

      - name: Executar framework de remediação
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_SSLMODE: require
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python framework.py

      - name: Upload arquivos remediados
        uses: actions/upload-artifact@v4
        with:
          name: remediated-files
          path: |
            composer.json
            composer.lock
            package.json
            package-lock.json
            requirements.txt

  # ============================================================
  # JOB 3: Abrir PR automático para homolog
  # ============================================================
  open-pr:
    name: 🚀 Abrir PR para Homolog
    needs: remediation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: remediated-files

      - name: Garantir que branch homolog existe
        run: |
          git fetch origin
          if ! git ls-remote --heads origin homolog | grep -q homolog; then
            git checkout -b homolog
            git push origin homolog
            echo "Branch homolog criada"
          else
            echo "Branch homolog já existe"
          fi

      - name: Criar Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: fix/auto-remediation-${{ github.run_id }}
          base: homolog
          title: "🔒 [Auto-Remediation] Correção automática de vulnerabilidades #${{ github.run_id }}"
          body: |
            ## 🔒 Remediação Automática de Vulnerabilidades SCA

            Pipeline: `${{ github.run_id }}` | Branch origem: `develop`

            ### O que foi feito:
            - ✅ Trivy detectou vulnerabilidades
            - ✅ Banco curado + OSV API consultados para versões seguras
            - ✅ Decisão automática por severidade (CRITICAL/HIGH → APPROVED)
            - ✅ Dependências atualizadas com menor impacto (same-major)
            - ✅ Histórico de auditoria salvo no Supabase

            ### Próximos passos:
            1. Revisar mudanças no `composer.json` / `package.json`
            2. Merge dispara re-scan automático no homolog
            3. Se vulnerabilidade persistir, pipeline bloqueia

            ### Auditoria:
            Todas as decisões estão registradas no Supabase com `execution_id` e timestamp.
          commit-message: "fix: atualiza dependências vulneráveis via remediação automática"
          delete-branch: false

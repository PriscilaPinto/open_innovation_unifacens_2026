name: DevSecOps - Remediação Automática

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  # ============================================================
  # JOB 1: Scan de vulnerabilidades (develop — somente leitura)
  # ============================================================
  security-scan:
    name: 🔍 Trivy SCA Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop

      - name: Instalar Trivy
        run: |
          sudo apt-get install -y wget gnupg lsb-release --quiet
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq && sudo apt-get install -y trivy

      - name: Executar scan
        run: |
          mkdir -p reports
          trivy fs . --format json --output reports/report.json

      - uses: actions/upload-artifact@v4
        with:
          name: trivy-report-${{ github.run_id }}
          path: reports/report.json

  # ============================================================
  # JOB 2: Aplicar remediações, commitar em branch isolada
  #         e mergear automaticamente em homolog
  #
  # develop NÃO é alterado.
  # Todas as correções vão para fix/auto-remediation-{run_id}
  # que é mergeada automaticamente em homolog.
  # A interação humana ocorre SOMENTE em homolog.
  # ============================================================
  remediation:
    name: 🤖 Remediação e Merge Automático em Homolog
    needs: security-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          name: trivy-report-${{ github.run_id }}
          path: reports/

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar PHP e Composer
        run: |
          sudo apt-get install -y php-cli php-curl php-mbstring php-xml --quiet
          curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
          composer --version

      - name: Instalar dependências Python
        run: pip install -r requirements.txt --quiet

      # Aplicar schema E migration da coluna previous_version
      - name: Aplicar schema e migrations no Supabase
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_SSLMODE: require
        run: |
          python - <<'EOF'
          import sys
          sys.path.insert(0, "scripts")
          from db import connect_db

          conn = connect_db()
          cur = conn.cursor()

          # Schema principal (CREATE TABLE IF NOT EXISTS — idempotente)
          with open("database/schema.sql") as f:
              cur.execute(f.read())
          conn.commit()

          # Migration: garante coluna previous_version
          with open("database/migrate_add_previous_version.sql") as f:
              cur.execute(f.read())
          conn.commit()

          # Seed do banco curado (ON CONFLICT DO NOTHING)
          try:
              with open("database/seed_homologated_versions.sql") as f:
                  cur.execute(f.read())
              conn.commit()
              print("Seed aplicado")
          except Exception as e:
              conn.rollback()
              print(f"Seed já populado: {e}")

          conn.close()
          print("Schema + migrations aplicados")
          EOF

      # Framework aplica as correções no workspace atual (checkout de develop)
      - name: Executar framework de remediação
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_SSLMODE: require
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python framework.py

      # Criar branch isolada, commitar TODOS os arquivos alterados
      # (composer.json + composer.lock + package.json + etc.)
      # develop permanece intacto
      - name: Criar branch de fix com as correções
        id: create-branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="fix/auto-remediation-${{ github.run_id }}"
          echo "FIX_BRANCH=$BRANCH" >> $GITHUB_ENV

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"

          # Adiciona todos os arquivos de dependências que podem ter sido alterados
          FILES_TO_ADD=(
            "composer.json"
            "composer.lock"
            "package.json"
            "package-lock.json"
            "requirements.txt"
          )
          for f in "${FILES_TO_ADD[@]}"; do
            [ -f "$f" ] && git add "$f"
          done

          if git diff --cached --quiet; then
            echo "Nenhuma alteração detectada."
            echo "HAS_CHANGES=false" >> $GITHUB_ENV
          else
            git commit -m "fix: remediação automática de vulnerabilidades (run #${{ github.run_id }})"
            git push origin "$BRANCH"
            echo "HAS_CHANGES=true" >> $GITHUB_ENV
            echo "Branch $BRANCH publicada com as correções"
          fi

      # Garantir que branch homolog existe
      - name: Garantir branch homolog
        if: env.HAS_CHANGES == 'true'
        run: |
          git fetch origin
          if ! git ls-remote --heads origin homolog | grep -q homolog; then
            git checkout -b homolog
            git push origin homolog
            echo "Branch homolog criada"
          fi
          git checkout homolog
          git pull origin homolog

      # Merge automático da branch de fix em homolog
      # Mínima interação humana: o merge ocorre automaticamente aqui.
      # A revisão humana acontece DEPOIS, em homolog, antes de ir para main/produção.
      - name: Merge automático em homolog
        if: env.HAS_CHANGES == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git checkout homolog
          git pull origin homolog

          git merge --no-ff origin/${{ env.FIX_BRANCH }} \
            -m "chore: merge automático da remediação run #${{ github.run_id }} em homolog"

          git push origin homolog
          echo "✅ Correções mergeadas em homolog automaticamente"

      # Notificação: abrir PR de homolog para main para revisão humana
      - name: Abrir PR de homolog para main (revisão humana)
        if: env.HAS_CHANGES == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: homolog
          base: main
          title: "🔒 [Homolog → Main] Validar remediação — run #${{ github.run_id }}"
          body: |
            ## 🔒 Remediação Validada — Aguardando Aprovação para Main

            **Pipeline:** `${{ github.run_id }}` | **Origem:** `develop` → `homolog`

            ### O que foi feito automaticamente
            - ✅ Trivy detectou vulnerabilidades em `develop`
            - ✅ Banco curado (Supabase) + OSV API consultados
            - ✅ Dependências atualizadas com estratégia same-major
            - ✅ `develop` **não foi alterado** — correções em branch isolada
            - ✅ Merge automático em `homolog` realizado
            - ✅ Security gate irá validar em homolog automaticamente

            ### Ação necessária
            Aguarde o security gate passar em `homolog`.
            Se o re-scan confirmar que as vulnerabilidades foram eliminadas,
            aprove este PR para promover para `main`.
          commit-message: "chore: promoção de homolog para main"
          delete-branch: false

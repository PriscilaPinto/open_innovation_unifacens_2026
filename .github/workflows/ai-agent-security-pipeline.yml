name: DevSecOps Automated Remediation Pipeline

on:
  push:
    branches:
      - develop
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write       
  pull-requests: write  

jobs:
  # ==========================================
  # JOB 1: SCAN DE VULNERABILIDADES
  # ==========================================
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: true

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.1

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare reports folder
        run: mkdir -p reports

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - [https://aquasecurity.github.io/trivy-repo/deb/public.key](https://aquasecurity.github.io/trivy-repo/deb/public.key) | sudo apt-key add -
          echo "deb [https://aquasecurity.github.io/trivy-repo/deb](https://aquasecurity.github.io/trivy-repo/deb) $(lsb_release -sc) main" \
          | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Run Trivy scan
        run: |
          trivy fs . \
            --format json \
            --output reports/report.json

      - name: Upload Trivy Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report-json
          path: reports/report.json

      - name: Commit and push report to develop
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add reports/report.json
          git commit -m "chore: atualiza relatorio Trivy [skip ci]" || echo "Sem alterações"
          git push origin develop

  # ==========================================
  # JOB 2: AGENTE DE IA (REMEDIAÇÃO SCA)
  # ==========================================
  ai-remediation:
    name: 🤖 Executar Agente de IA (Remediação SCA)
    needs: security-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: develop 

      - name: Download Trivy Report
        uses: actions/download-artifact@v4
        with:
          name: trivy-report-json

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          pip install langchain-core langchain-google-genai

      - name: Run AI Remediation Framework (SCA)
        env:
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python framework.py

      - name: Upload Remediated SCA Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sca-remediated-files
          path: |
            composer.json
            composer.lock

  # ==========================================
  # JOB 3: VALIDAÇÃO E ABERTURA AUTOMÁTICA DE PR
  # ==========================================
  security-validation:
    name: 🧪 Validação e Abertura de PR
    needs: ai-remediation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: homolog 

      - name: Download Remediated SCA Files
        uses: actions/download-artifact@v4
        with:
          name: sca-remediated-files

      - name: Setup PHP Environment for Sandbox
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: ⚙️ Teste de Instalação (Composer Validation)
        run: composer install --no-interaction --dry-run

      - name: 🔍 Re-scan de Segurança SCA no Ambiente
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Clean Runner Cache
        run: rm -rf .cache/

      - name: 🚀 Create Pull Request to Homolog
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: fix/ai-autonomous-patch
          base: homolog
          title: "🤖 [AI SCA Remediation] Atualização autônoma de dependências vulneráveis"
          body: |
            ## 🛡️ Remediação Autônoma Baseada em IA (SCA)
            Este Pull Request foi gerado automaticamente pelo **Framework de Correção Baseado em Generative AI**.

            ### 📊 Evidências e Validações:
            - **Análise de Dependências:** `composer.json` e `composer.lock` atualizados estrategicamente pela IA.
            - **Re-scan de Segurança (Trivy SCA):** Executado após a correção e acusado **ZERO** vulnerabilidades Críticas ou Altas.
          commit-message: "fix: atualiza pacotes vulneráveis via IA (SCA)"
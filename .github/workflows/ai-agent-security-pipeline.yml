name: DevSecOps - Remediação Automática

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  # ============================================================
  # JOB 1: Scan de vulnerabilidades (develop — somente leitura)
  # ============================================================
  security-scan:
    name: 🔍 Trivy SCA Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop

      - name: Instalar Trivy
        run: |
          sudo apt-get install -y wget gnupg lsb-release --quiet
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq && sudo apt-get install -y trivy

      - name: Scan JSON (para processamento pelo agente)
        run: |
          mkdir -p reports
          trivy fs . --format json --output reports/report.json --skip-version-check

      - name: Scan tabela (visualização no log)
        run: |
          trivy fs . --format table --severity CRITICAL,HIGH,MEDIUM --skip-version-check || true

      - uses: actions/upload-artifact@v4
        with:
          name: trivy-report-${{ github.run_id }}
          path: reports/report.json

# ============================================================
# JOB 2: Agente de IA processa vulnerabilidades, aplica
#         correções e publica em fix/remediation
#
# develop NÃO é alterado.
# Branch intermediária: fix/remediation
#
# O push nessa branch dispara a Pipeline 2
# ============================================================
  remediation:
    name: 🤖 Agente IA - Remediação (develop → fix/remediation)
    needs: security-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          name: trivy-report-${{ github.run_id }}
          path: reports/

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências Python
        run: pip install -r requirements.txt --quiet

      # Lê o relatório Trivy para detectar ecossistemas (SCA puro)
      # e instala APENAS os gerenciadores necessários para os patches
      - name: Detectar ecossistemas no Trivy e instalar dependências
        run: |
          if grep -q '"Type": "composer"' reports/report.json 2>/dev/null; then
            echo "📦 PHP (composer) detectado no Trivy — instalando..."
            sudo apt-get install -y php-cli php-curl php-mbstring php-xml --quiet
            curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
            composer --version
          fi
          if grep -q '"Type": "npm"' reports/report.json 2>/dev/null || grep -q '"Type": "package"' reports/report.json 2>/dev/null; then
            echo "📦 Node.js (npm) detectado no Trivy — instalando..."
            sudo apt-get install -y nodejs npm --quiet
            node --version
            npm --version
          fi
          if grep -q '"Type": "pip"' reports/report.json 2>/dev/null || grep -q '"Type": "poetry"' reports/report.json 2>/dev/null; then
            echo "📦 Python (pip) detectado no Trivy — já instalado com Python"
          fi

      - name: Aplicar schema e migrations no Supabase
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_SSLMODE: require
        run: |
          python - <<'EOF'
          import sys
          sys.path.insert(0, "scripts")
          from db import connect_db

          conn = connect_db()
          cur = conn.cursor()

          # Schema principal
          with open("database/schema.sql") as f:
              cur.execute(f.read())
          conn.commit()
          print("✅ Schema principal aplicado")

          # Todas as migrations em um arquivo
          with open("database/migrate_add_previous_version.sql") as f:
              cur.execute(f.read())
          conn.commit()
          print("✅ Migrations aplicadas (previous_version + source_db)")

          # Remove entradas erradas do psr7 e força re-seed
          cur.execute("""
              DELETE FROM homologated_versions
              WHERE package_name = 'guzzlehttp/psr7'
                AND safe_version = '1.9.1'
          """)
          conn.commit()
          print("✅ Cleanup: versão psr7 1.9.1 removida")

          try:
              with open("database/seed_homologated_versions.sql") as f:
                  cur.execute(f.read())
              conn.commit()
              print("✅ Seed aplicado")
          except Exception as e:
              conn.rollback()
              print(f"⚠️  Seed já populado: {e}")

          conn.close()
          print("✅ BD pronto: schema + migrations + seed!")
          EOF

      # Agente de IA orquestra todo o pipeline:
      # Stage 1: lê Trivy report + persiste no Supabase + consulta OSV
      # Stage 2: IA analisa CVEs e decide estratégia (APPROVED/MANUAL_REVIEW)
      # Stage 3: aplica patches via composer/npm/pip (multi-linguagem)
      - name: Executar Agente de IA (Stages 1-3)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_SSLMODE: require
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MIN_SEVERITY: HIGH
          AI_MODEL: gemini-2.5-flash
          AI_TEMPERATURE: "0.1"
          AI_MAX_TOKENS: "600"
        run: python framework.py

      # Stage 4: Re-scan Trivy é feito na security-gate em homolog
      # (não repetir aqui — trivy não está instalado neste job)
      # Responsabilidade: job security-scan instala trivy, não este job

      # ============================================================
      # ============================================================
      # CRÍTICO: Branch fix/remediation baseada em origin/develop
      #
      # FLUXO CORRETO:
      #   1. Stage das alterações geradas pelo agente
      #   2. Commit temporário dos patches
      #   3. fix/remediation criada a partir de ORIGIN/DEVELOP
      #   4. Cherry-pick somente das correções geradas
      #   5. Push para fix/remediation
      #
      # A Pipeline 2 será disparada pelo push nessa branch
      # e será responsável pela validação e promoção para homolog
      # ============================================================
      # ============================================================
      # ============================================================
      # CRÍTICO: Branch fix/remediation baseada em origin/develop
      #
      # FLUXO CORRETO:
      #   1. Stage das alterações geradas pelo agente
      #   2. Commit temporário dos patches
      #   3. fix/remediation criada a partir de ORIGIN/DEVELOP
      #      (garante que a base é develop remoto)
      #   4. Cherry-pick somente das correções geradas
      #   5. Push para fix/remediation
      #
      # A Pipeline 2 será disparada pelo push nessa branch
      # e será responsável pela validação e promoção para homolog
      # ============================================================
      - name: Criar branch fix/remediation com patches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "📦 Salvando alterações geradas pelo agente"

          git add -A

          if git diff --cached --quiet; then
            echo "HAS_CHANGES=false" >> $GITHUB_ENV
            echo "📭 Nenhuma alteração gerada pelo agente"
            exit 0
          fi

          git commit -m "fix: remediação automática via agente IA"

          PATCH_COMMIT=$(git rev-parse HEAD)

          echo "🌱 Criando branch fix/remediation baseada em origin/develop"

          git checkout -B fix/remediation origin/develop

          echo "♻️ Aplicando somente o commit de correção"

          git cherry-pick $PATCH_COMMIT

          echo "🚀 Enviando correções para fix/remediation"

          git push origin fix/remediation --force

          echo "HAS_CHANGES=true" >> $GITHUB_ENV

          echo "✅ Correções publicadas em fix/remediation"
          
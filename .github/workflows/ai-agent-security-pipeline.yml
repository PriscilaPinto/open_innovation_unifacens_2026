name: DevSecOps Automated Remediation Pipeline

on:
  push:
    branches:
      - develop
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  # STAGE 1: Coleta estática agnóstica de vulnerabilidades
  security-scan:
    name: 🔍 Scan de Vulnerabilidades Multi-Linguagem
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" \
          | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Run Trivy scan (Varre a raiz buscando qualquer linguagem)
        run: |
          mkdir -p reports
          trivy fs . --format json --output reports/report.json

      - name: Upload Trivy Report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report-json
          path: reports/report.json

  # STAGE 2: O Agente processa vulnerabilidades e decide remediações
  ai-remediation:
    name: 🤖 Processamento e Decisão de Remediação
    needs: security-scan
    runs-on: ubuntu-latest
    
    # ==========================================
    # POSTGRESQL SERVICE CONTAINER
    # ==========================================
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: remediation
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Download Trivy Report
        uses: actions/download-artifact@v4
        with:
          name: trivy-report-json
          path: reports/

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: pip install -r requirements.txt

      - name: Setup Database Schema
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d remediation -f database/schema.sql

      - name: Seed Homologated Versions (Curated Database)
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d remediation -f database/seed_homologated_versions.sql

      - name: Run Remediation Framework
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: remediation
          DB_USER: postgres
          DB_PASSWORD: postgres
          USE_CURATED_DB: "true"
        run: python framework.py

      - name: Export Audit Data (for persistence)
        env:
          PGPASSWORD: postgres
        run: |
          mkdir -p audit_logs
          
          # Exportar execuções do pipeline
          psql -h localhost -U postgres -d remediation -c \
            "COPY (SELECT * FROM pipeline_executions) TO STDOUT WITH CSV HEADER" \
            > audit_logs/pipeline_executions_$(date +%Y%m%d_%H%M%S).csv
          
          # Exportar vulnerabilidades
          psql -h localhost -U postgres -d remediation -c \
            "COPY (SELECT * FROM vulnerability_records) TO STDOUT WITH CSV HEADER" \
            > audit_logs/vulnerability_records_$(date +%Y%m%d_%H%M%S).csv
          
          # Exportar métricas (resumo JSON)
          psql -h localhost -U postgres -d remediation -t -c \
            "SELECT json_agg(row_to_json(t)) FROM (
              SELECT 
                COUNT(*) as total_vulnerabilities,
                COUNT(*) FILTER (WHERE decision_status = 'APPROVED') as approved,
                COUNT(*) FILTER (WHERE remediation_status = 'REMEDIATED') as remediated,
                COUNT(*) FILTER (WHERE remediation_status = 'FAILED') as failed
              FROM vulnerability_records
            ) t" > audit_logs/metrics_$(date +%Y%m%d_%H%M%S).json

      - name: Upload Audit Logs
        uses: actions/upload-artifact@v4
        with:
          name: audit-logs
          path: audit_logs/
          retention-days: 90  # Mantém por 90 dias no GitHub

      - name: Upload Remediated Files
        uses: actions/upload-artifact@v4
        with:
          name: remediated-dependencies
          path: |
            composer.json
            composer.lock
            package.json
            package-lock.json
            requirements.txt

  # STAGE 3: Validação genérica da proteção e abertura do Pull Request para Homolog
  security-validation:
    name: 🧪 Validação e Abertura de PR Automatizado
    needs: ai-remediation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Download Remediated Files
        uses: actions/download-artifact@v4
        with:
          name: remediated-dependencies

      - name: 🔍 Re-scan pós-remediação
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'

      - name: 🧹 Limpar cache do Trivy
        run: |
          rm -rf .cache/ trivy_envs.txt

      - name: 🚀 Create Pull Request to Homolog
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: fix/auto-remediation
          base: homolog
          title: "🔒 [Auto-Remediation] Correção automática de vulnerabilidades"
          body: |
            ## 🔒 Remediação Automática de Vulnerabilidades SCA
            
            Este Pull Request foi gerado automaticamente pelo **Framework de Remediação**.

            ### 📊 O que foi feito:
            - ✅ Trivy detectou vulnerabilidades
            - ✅ Framework consultou banco curado + OSV API para versões homologadas
            - ✅ Decisão automática baseada em severidade (HIGH/CRITICAL)
            - ✅ Dependências atualizadas para versões de menor impacto
            - ✅ Re-scan validou correção

            ### 📝 Próximos passos:
            1. Revisar mudanças no `composer.json`/`package.json`
            2. Executar testes da aplicação localmente
            3. Aprovar e mergear se tudo estiver OK
            
            ### 🔍 Auditoria:
            Todas as decisões foram registradas no banco PostgreSQL e exportadas como artifacts.
          commit-message: "fix: corrige vulnerabilidades via remediação automática"
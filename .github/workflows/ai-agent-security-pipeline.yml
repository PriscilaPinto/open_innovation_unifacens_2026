name: DevSecOps - Remediação Automática

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  # ============================================================
  # JOB 1: Scan de vulnerabilidades (develop — somente leitura)
  # ============================================================
  security-scan:
    name: 🔍 Trivy SCA Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop

      - name: Instalar Trivy
        run: |
          sudo apt-get install -y wget gnupg lsb-release --quiet
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq && sudo apt-get install -y trivy

      - name: Scan JSON (para processamento pelo agente)
        run: |
          mkdir -p reports
          trivy fs . --format json --output reports/report.json --skip-version-check

      - name: Scan tabela (visualização no log)
        run: |
          trivy fs . --format table --severity CRITICAL,HIGH,MEDIUM --skip-version-check || true

      - uses: actions/upload-artifact@v4
        with:
          name: trivy-report-${{ github.run_id }}
          path: reports/report.json

  # ============================================================
  # JOB 2: Agente de IA processa vulnerabilidades, aplica
  #         correções e mergeia em fix-remediation → homolog
  #
  # develop NÃO é alterado.
  # Branch intermediária: fix-remediation (nome fixo, sobrescrita a cada run)
  # ============================================================
  remediation:
    name: 🤖 Agente IA - Remediação (develop → fix/remediation)
    needs: security-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          name: trivy-report-${{ github.run_id }}
          path: reports/

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências Python
        run: pip install -r requirements.txt --quiet

      - name: Instalar PHP + Composer (se composer.json existir)
        if: hashFiles('composer.json') != ''
        run: |
          echo "📦 composer.json detectado — instalando PHP + Composer..."
          sudo apt-get install -y php-cli php-curl php-mbstring php-xml --quiet
          curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
          composer --version

      - name: Aplicar schema e migrations no Supabase
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_SSLMODE: require
        run: |
          python - <<'EOF'
          import sys
          sys.path.insert(0, "scripts")
          from db import connect_db

          conn = connect_db()
          cur = conn.cursor()

          # Schema principal
          with open("database/schema.sql") as f:
              cur.execute(f.read())
          conn.commit()
          print("✅ Schema principal aplicado")

          # Todas as migrations em um arquivo
          with open("database/migrate_add_previous_version.sql") as f:
              cur.execute(f.read())
          conn.commit()
          print("✅ Migrations aplicadas (previous_version + source_db)")

          # Remove entradas erradas do psr7 e força re-seed
          cur.execute("""
              DELETE FROM homologated_versions
              WHERE package_name = 'guzzlehttp/psr7'
                AND safe_version = '1.9.1'
          """)
          conn.commit()
          print("✅ Cleanup: versão psr7 1.9.1 removida")

          try:
              with open("database/seed_homologated_versions.sql") as f:
                  cur.execute(f.read())
              conn.commit()
              print("✅ Seed aplicado")
          except Exception as e:
              conn.rollback()
              print(f"⚠️  Seed já populado: {e}")

          conn.close()
          print("✅ BD pronto: schema + migrations + seed!")
          EOF

      # Agente de IA orquestra todo o pipeline:
      # Stage 1: lê Trivy report + persiste no Supabase + consulta OSV
      # Stage 2: IA analisa CVEs e decide estratégia (APPROVED/MANUAL_REVIEW)
      # Stage 3: aplica patches via composer/npm/pip (multi-linguagem)
      - name: Executar Agente de IA (Stages 1-3)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_SSLMODE: require
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MIN_SEVERITY: HIGH
          AI_MODEL: gemini-2.5-flash
          AI_TEMPERATURE: "0.1"
          AI_MAX_TOKENS: "600"
        run: python framework.py

      # Stage 4: Re-scan Trivy é feito na security-gate em homolog
      # (não repetir aqui — trivy não está instalado neste job)
      # Responsabilidade: job security-scan instala trivy, não este job

      # ============================================================
      # CRÍTICO: Branch fix/remediation baseada em origin/develop
      # 
      # FLUXO CORRETO:
      #   1. Stash: salva as alterações do working tree
      #   2. fix/remediation criada a partir de ORIGIN/DEVELOP
      #      (garante que a base é develop remoto, não HEAD local)
      #   3. Stash pop: aplica APENAS os patches em cima de origin/develop
      #   4. Commit + push: apenas o diff dos patches vai para fix/remediation
      #   5. PR: fix/remediation → homolog (NUNCA develop)
      #
      # ANTIGO (bug): git checkout -B fix/remediation (sem origin/develop)
      #   fazia a branch apontar para o HEAD local = develop, resultando
      #   em PR para develop em vez de homolog
      # ============================================================
      - name: Criar branch fix/remediation com patches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 1. Stash: salva alterações do working tree (composer.json, etc.)
          git stash 2>/dev/null || true

          # 2. Cria fix/remediation a partir de ORIGIN/DEVELOP (NÃO do HEAD local)
          git checkout -B fix/remediation origin/develop

          # 3. Pop: aplica os patches salvos
          git stash pop 2>/dev/null || true

          # 4. Adiciona APENAS arquivos de dependências modificados
          for f in composer.json composer.lock package.json package-lock.json requirements.txt; do
            if [ -f "$f" ]; then
              git add "$f" 2>/dev/null || true
              echo "   Adicionado: $f"
            fi
          done

          # 5. Se houver mudanças, commit + push
          if git diff --cached --quiet; then
            echo "HAS_CHANGES=false" >> $GITHUB_ENV
            echo "📭 Nenhuma alteração — sem vulnerabilidades para corrigir."
          else
            git status --short
            git commit -m "fix: remediação automática via agente de IA (run #${{ github.run_id }})"
            git push origin fix/remediation --force
            echo "HAS_CHANGES=true" >> $GITHUB_ENV
            echo "✅ Branch fix/remediation contém APENAS os patches (base: origin/develop)"
          fi

      - name: Reset develop para origin/develop (imutável)
        if: env.HAS_CHANGES == 'true'
        run: |
          git checkout develop
          git reset --hard origin/develop
          echo "✅ develop resetada para origin/develop (imutável)"

      - name: Info - Pipeline Completa
        if: env.HAS_CHANGES == 'true'
        run: |
          echo "✅ Correções aplicadas automaticamente em fix/remediation"
          echo "🔒 develop permanece imutável"
          echo "📋 Para finalizar, faça o merge de fix/remediation → homolog"
          echo "   A segunda pipeline (homolog-security-gate) validará o código"

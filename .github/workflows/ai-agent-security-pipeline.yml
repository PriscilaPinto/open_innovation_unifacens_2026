name: DevSecOps Automated Remediation Pipeline

on:
  push:
    branches:
      - develop
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write       # Necessário para criar a branch temporária de correção e commitar
  pull-requests: write  # Necessário para abrir o Pull Request automaticamente contra a homolog

jobs:
  # ==========================================
  # JOB 1: SCAN DE VULNERABILIDADES (O primeiro da fila)
  # ==========================================
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: true

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.1

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare reports folder
        run: mkdir -p reports

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" \
          | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Run Trivy scan
        run: |
          trivy fs . \
            --format json \
            --output reports/report.json

      # Upload do relatório para o Job da IA consumir com segurança
      - name: Upload Trivy Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report-json
          path: reports/report.json

      # NOVO: Sincroniza o relatório na develop ANTES da IA começar
      - name: Commit and push report to develop
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add reports/report.json
          git commit -m "chore: atualiza relatorio Trivy [skip ci]" || echo "Sem alterações"
          git push origin develop

  # ==========================================
  # JOB 2: AGENTE DE IA (Só começa quando o Job 1 terminar de dar o push!)
  # ==========================================
  ai-remediation:
    name: 🤖 Executar Agente de IA (Remediação)
    needs: security-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: develop # Baixa o código já com o report.json atualizado pelo Job 1

      - name: Download Trivy Report
        uses: actions/download-artifact@v4
        with:
          name: trivy-report-json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          pip install langchain-core langchain-google-genai

      - name: Run AI Remediation Framework
        env:
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python framework.py

      - name: Upload Remediated File Artifact
        uses: actions/upload-artifact@v4
        with:
          name: remediated-php-file
          path: index_remediated.php

  # ==========================================
  # JOB 3: VALIDAÇÃO E ABERTURA AUTOMÁTICA DE PR (O último da fila)
  # ==========================================
  security-validation:
    name: 🧪 Validação e Abertura de PR
    needs: ai-remediation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: homolog # Prepara o ambiente em cima de homolog para receber o patch

      - name: Download Remediated File
        uses: actions/download-artifact@v4
        with:
          name: remediated-php-file

      - name: Setup PHP Environment for Sandbox
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: ⚙️ Teste de Sintaxe (PHP Lint)
        run: php -l index_remediated.php

      - name: 🔍 Re-scan de Segurança no Código da IA
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'index_remediated.php'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Apply AI Patch and Clean Cache
        run: |
          cp index_remediated.php index.php
          rm index_remediated.php
          rm -rf .cache/

      - name: 🚀 Create Pull Request to Homolog
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: fix/ai-autonomous-patch
          base: homolog
          title: "🤖 [AI Remediation] Virtual Patching para mitigação de CVEs"
          body: |
            ## 🛡️ Remediação Autônoma Baseada em IA
            Este Pull Request foi gerado automaticamente pelo **Framework de Correção Baseado em Generative AI**.

            ### 📊 Evidências e Validações:
            - **Análise Sintática (`php -l`):** Passou com sucesso em ambiente sandbox (PHP 8.3).
            - **Re-scan de Segurança (Trivy):** Executado após a correção e acusou **ZERO** vulnerabilidades Críticas ou Altas.
          commit-message: "fix: aplica patch autonomo gerado pela IA"